<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>
    
    

    <style>
        * {
            margin: 0;
        }

        html {
            background: rgb(120, 96, 64);
            
        }

        

        header {
            background-image: url("images/jesus_feeds_5000.jpeg");
            height: 200px;
            background-size: cover;
            align-items: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            border-radius: 43px 43px 0 0;
        }

        #closeBtn {
            align-self: flex-start;
            margin: 5px 10px 40px;
            
        }

        #formContainer img {
            width: 60px;
            display: inline-block;
            margin: 3px;
            margin-top: 20px;

        }

        #formContainer {
            padding: 0 10px 10px;
        }

        #formContainer h2 {
            grid-column: 1/3;
        }

        #formContainer h3 {
            grid-column: 1/3;
            text-align: center;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        body {
            background: white;
            border: 7px solid blue;
            width: 50%;
            
            margin: 20px auto 100px;
            box-sizing: border-box;

            border-radius: 50px;
            overflow: hidden;

            

        }
        #myform {
            
        }

        #label[for="username"] {
            grid-row: 1;
            grid-column: 1;
        }

        #username {
            grid-row: 1;
            grid-column: 2;
        }

        #password {
            grid-row: 2;
            grid-column: 2;
        }

        #myForm {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            row-gap: 20px;
            margin-left: 20px;
            margin-right: 20px;
        }

        header h1,
        header h2 {
            text-shadow: 2px 2px 4px black;
            position: relative;
            top: -20px;
        }

        #myForm section:last-child {
            grid-column: 1/3;
            text-align: center;
        }

        #myForm section {
            grid-column: 1/3;
        }
        


    </style>



</head>

<body>
    <header>
        <button type="button" id="closeBtn">X</button>
        <h1>Daily Scripture Feed</h1>
        <h2>Scripture a Day</h2>
    </header>
    <div id="formContainer">
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
         <img src="images/book_of_mormon.webp" alt="bom">
         <img src="images/doctrine_and_covenants.webp" alt="d&c">
         <img src="images/new_testament.webp" alt="nt">
         <img src="images/old_testament.webp" alt="ot">
         <img src="images/pearl_of_great_price.webp" alt="pogp">

    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
